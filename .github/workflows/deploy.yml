name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A firebase-tools CLI-vel deployolunk (hosting + database rules egyben).
      # Korábban a FirebaseExtended/action-hosting-deploy@v0 akciót használtuk, de az egy
      # ismert "premature close → retry → a verzió már aktív (400)" versenyhelyzet miatt
      # pirosra váltott, miközben a hosting valójában kiment — és emiatt a database rules
      # lépés ki is maradt. A CLI-deploy ezt megbízhatóan, egy lépésben elvégzi.
      - name: Deploy hosting + database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA="$FIREBASE_SERVICE_ACCOUNT"
          if echo "$SA" | base64 -d 2>/dev/null | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
            echo "$SA" | base64 -d > /tmp/sa.json
          else
            echo "$SA" > /tmp/sa.json
          fi
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx firebase-tools@latest deploy --only hosting,database --project vb-tippjatek-19fda --non-interactive
